<dialog #dialog class="appointment-dialog" (click)="closeOnBackdrop($event)">
    <div class="dialog-panel" role="document">
        <div class="dialog-header">
            <div>
                <p class="eyebrow">Agenda clínica</p>
                <h2>Agendar cita</h2>
                <p class="dialog-intro">Completa los datos para reservar una consulta.</p>
            </div>
            <button type="button" class="close-button" aria-label="Cerrar diálogo" (click)="close()">×</button>
        </div>

        <form #appointmentForm (submit)="$event.preventDefault(); submit(appointmentForm)">
            @if (!noDpi) {
                <label>
                    DPI
                    <input
                        name="dpi"
                        type="text"
                        placeholder="0000 00000 0000"
                        inputmode="numeric"
                        autocomplete="off"
                        maxlength="15"
                        pattern="[0-9 ]{13,15}"
                        (input)="schedulePatientSearch(appointmentForm)"
                        (change)="searchPatient(appointmentForm)"
                        [required]="!noDpi">
                </label>
            }

            <label class="checkbox-field">
                <input
                    name="noDpi"
                    type="checkbox"
                    [checked]="noDpi"
                    (change)="toggleNoDpi($any($event.target).checked)">
                El paciente no tiene DPI
            </label>

            @if (patientLoading && !noDpi) {
                <p class="form-hint" role="status">Buscando paciente...</p>
            }

            @if (patientSearchError) {
                <p class="form-error" role="alert">{{ patientSearchError }}</p>
            }

            <div class="form-row">
                <label>
                    Nombres
                    <input name="nombres" type="text" placeholder="Nombres" autocomplete="given-name" required>
                </label>
                <label>
                    Apellidos
                    <input name="apellidos" type="text" placeholder="Apellidos" autocomplete="family-name" required>
                </label>
            </div>

            @if (showAdditionalPatientData) {
                <div class="form-row">
                    <label>
                        Email
                        <input name="email" type="email" placeholder="correo@ejemplo.com" autocomplete="email" [required]="showAdditionalPatientData">
                    </label>
                    <label>
                        Teléfono
                        <input name="telefono" type="tel" placeholder="5555-1234" autocomplete="tel" [required]="showAdditionalPatientData">
                    </label>
                </div>

                <div class="form-row">
                    <label>
                        Fecha de nacimiento
                        <input name="fechaNacimiento" type="date" [required]="showAdditionalPatientData">
                    </label>
                    <label>
                        Dirección
                        <input name="direccion" type="text" placeholder="Dirección" [required]="showAdditionalPatientData">
                    </label>
                </div>
            }

            <label>
                Especialidad
                <select name="specialty" required>
                    <option value="" selected disabled>Selecciona una especialidad</option>
                    <option value="medicina-general">Medicina general</option>
                    <option value="cardiologia">Cardiología</option>
                    <option value="dermatologia">Dermatología</option>
                    <option value="pediatria">Pediatría</option>
                </select>
            </label>

            <div class="form-row">
                <label>
                    Fecha
                    <input name="date" type="date" [value]="selectedDate()" required>
                </label>
                <label>
                    Hora
                    <input name="time" type="time" required>
                </label>
            </div>

            <label>
                Motivo de consulta
                <textarea name="reason" rows="3" placeholder="Describe brevemente el motivo" required></textarea>
            </label>

            @if (saveError) {
                <p class="form-error" role="alert">{{ saveError }}</p>
            }

            <div class="dialog-actions">
                <button type="button" class="secondary-button" (click)="close()">Cancelar</button>
                <button type="submit" class="primary-button" [disabled]="isSaving">
                    {{ isSaving ? 'Guardando...' : 'Confirmar cita' }}
                </button>
            </div>
        </form>
    </div>
</dialog>
