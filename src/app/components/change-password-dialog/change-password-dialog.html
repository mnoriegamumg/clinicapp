<dialog #dialog class="change-password-dialog" (click)="closeOnBackdrop($event)">
  <div class="dialog-panel" role="document">
    <div class="dialog-header">
      <div>
        <p class="eyebrow">Mi cuenta</p>
        <h2>Cambiar contraseña</h2>
        <p class="dialog-intro">Actualiza la contraseña de tu cuenta.</p>
      </div>
      <button type="button" class="close-button" aria-label="Cerrar diálogo" (click)="close()">×</button>
    </div>

    <form #passwordForm (submit)="$event.preventDefault(); submit(passwordForm)">
      <label>
        Contraseña actual
        <input name="passwordActual" type="password" autocomplete="current-password" placeholder="Contraseña actual" required>
      </label>

      <label>
        Nueva contraseña
        <input name="passwordNueva" type="password" autocomplete="new-password" placeholder="Nueva contraseña" minlength="8" required>
      </label>

      <label>
        Confirmar nueva contraseña
        <input name="passwordConfirmar" type="password" autocomplete="new-password" placeholder="Repite la nueva contraseña" minlength="8" required>
      </label>

      @if (saveError()) {
        <p class="form-error" role="alert">{{ saveError() }}</p>
      }
      @if (saveSuccess()) {
        <p class="form-success" role="status">{{ saveSuccess() }}</p>
      }

      <div class="dialog-actions">
        <button type="button" class="secondary-button" (click)="close()">Cerrar</button>
        <button type="submit" class="primary-button" [disabled]="isSaving()">
          {{ isSaving() ? 'Guardando...' : 'Cambiar contraseña' }}
        </button>
      </div>
    </form>
  </div>
</dialog>
