<aside class="app-sidebar">
    <a class="brand" routerLink="/calendario" aria-label="Ir al calendario de ClinicaApp">
        <span class="brand-symbol">✦</span>
        <span>
            <strong>Clini<span>ca</span>App</strong>
            <small>Centro Médico</small>
            <small>Prosamed</small>
        </span>
    </a>

    <nav class="main-nav" aria-label="Navegación principal">
        <p class="nav-label">Menú principal</p>
        @for (menu of visibleMenus(); track menu.route) {
            @if (menu.disabled) {
                <a class="nav-item-muted" aria-disabled="true">
                    <span class="nav-icon" aria-hidden="true">{{ menu.icon }}</span>
                    <span>{{ menu.name }}</span>
                    <small>Próximamente</small>
                </a>
            } @else {
                <a [routerLink]="menu.route" routerLinkActive="active"
                    [routerLinkActiveOptions]="{ exact: menu.route === '/home' }">
                    <span class="nav-icon" aria-hidden="true">{{ menu.icon }}</span>
                    <span>{{ menu.name }}</span>
                </a>
            }
        }
    </nav>

    <div class="sidebar-footer">
        <button type="button" class="account-button" (click)="openChangePassword()" aria-label="Cambiar contraseña">
            <span class="nav-icon" aria-hidden="true">🔑</span>
            <span>Cambiar contraseña</span>
        </button>
        <button type="button" class="logout-button" (click)="logout()" aria-label="Cerrar sesión">
            <span class="nav-icon" aria-hidden="true">⇠</span>
            <span>Cerrar sesión</span>
        </button>
    </div>

    <app-change-password-dialog
        [open]="isChangePasswordOpen()"
        (closed)="closeChangePassword()"
        (saved)="closeChangePassword()">
    </app-change-password-dialog>

    <div class="sidebar-user" aria-label="Usuario autenticado">
        <div class="user-badge" aria-hidden="true">{{ userInitial() }}</div>
        <div class="user-info">
            <strong title="{{ userName() }}">{{ userName() }}</strong>
            <span>{{ userRole() }}</span>
        </div>
    </div>
</aside>
